[project]
name = "ragmemory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "tqdm>=4.0.0",
    "mcp>=1.27.1",
    "sentence-transformers>=5.5.1",
    "tokenizers>=0.22.0,<=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
